plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thndang.babymusic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thndang.babymusic'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    androidResources {
        noCompress += ['mp3']
    }
}
