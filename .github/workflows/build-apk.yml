name: Build Baby Music APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "sources.json"
      - "scripts/download_audio.py"
      - "scripts/generate_public_domain_music.py"
      - "app/**"
  workflow_dispatch:
    inputs:
      urls:
        description: "Tùy chọn: URL media mà bạn có quyền tải, dùng thay cho sources.json. Để trống để tải 28 bài trong sources.json."
        required: false
        type: string
      builtin_music:
        description: "Bỏ qua YouTube, build bằng 7 bài nursery public-domain có sẵn"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Generate music and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp cần Deno để giải JS challenge của YouTube.
      - name: Set up Deno
        if: ${{ !inputs.builtin_music }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install audio tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]"
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate built-in nursery music
        if: ${{ inputs.builtin_music }}
        shell: bash
        run: |
          python scripts/generate_public_domain_music.py \
            --assets app/src/main/assets

      - name: Prepare optional cookies
        if: ${{ !inputs.builtin_music }}
        id: cookies
        shell: bash
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            echo "$YOUTUBE_COOKIES_B64" | base64 --decode > "$RUNNER_TEMP/youtube-cookies.txt"
            echo "args=--cookies $RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Chưa có secret YOUTUBE_COOKIES_B64. YouTube thường chặn runner của GitHub (\"Sign in to confirm you're not a bot\"); xem README để thêm cookies."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download songs from sources.json or input URLs
        if: ${{ !inputs.builtin_music }}
        shell: bash
        env:
          INPUT_URLS: ${{ inputs.urls }}
        run: |
          python scripts/download_audio.py \
            --sources sources.json \
            --assets app/src/main/assets \
            ${{ steps.cookies.outputs.args }}

      - name: Show packaged songs
        shell: bash
        run: |
          cat app/src/main/assets/songs.json
          echo
          ls -lh app/src/main/assets/audio/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baby-music-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload generated MP3 files
        uses: actions/upload-artifact@v4
        with:
          name: baby-music-audio
          path: app/src/main/assets/audio/*.mp3
          retention-days: 30
          if-no-files-found: error
